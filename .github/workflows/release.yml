# ShackBook release workflow.
#
# Trigger:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Builds Windows / Linux / macOS in parallel, then publishes a GitHub
# Release with all three binaries attached.  Manual runs via the Actions
# tab are also supported (workflow_dispatch).
#
# Artifacts produced:
#   ShackBook-<tag>-windows-x64.zip      — extract, run ShackBook.exe
#   ShackBook-<tag>-linux-x86_64.AppImage — chmod +x, run directly
#   ShackBook-<tag>-macos-arm64.dmg      — Apple Silicon
#   ShackBook-<tag>-macos-x86_64.dmg     — Intel Macs, macOS 12 or later

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

env:
  QT_VERSION: '6.8.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # opt in to Node 24 now; avoids forced migration warnings

jobs:
  # ── Windows ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebsockets qtserialport'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHACKBOOK_RELEASE=ON

      - name: Build
        run: cmake --build build

      - name: Stage and zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($version) -or -not $version.StartsWith("v")) {
              $version = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $stage = "ShackBook-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Top-level runtime files: exe + DLLs deployed by windeployqt.
          Copy-Item build\ShackBook.exe $stage\
          Get-ChildItem build\*.dll | Copy-Item -Destination $stage\
          if (Test-Path build\vc_redist.x64.exe) {
              Copy-Item build\vc_redist.x64.exe $stage\
          }

          # Plugin directories created by windeployqt.
          $pluginDirs = @('platforms','sqldrivers','styles','imageformats',
                          'iconengines','tls','networkinformation','generic')
          foreach ($d in $pluginDirs) {
              if (Test-Path "build\$d") { Copy-Item -Recurse "build\$d" $stage\ }
          }

          Copy-Item README.md $stage\
          Copy-Item LICENSE  $stage\

          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          Write-Host "Created $stage.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: windows-zip
          path: ShackBook-*-windows-x64.zip
          if-no-files-found: error

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($version) -or -not $version.StartsWith("v")) {
              $version = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $stage = "ShackBook-$version-windows-x64"

          # Inno Setup 6 ships preinstalled on windows-2022 GitHub runners;
          # if a future image drops it, fall back to chocolatey.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
              throw "ISCC.exe not found at $iscc — Inno Setup install failed"
          }

          # ISCC reads SHACKBOOK_VERSION + SHACKBOOK_STAGING via GetEnv() in
          # the .iss script.  /O. forces the output to the working
          # directory regardless of where the .iss file lives, otherwise
          # the OutputDir directive in the script is interpreted relative
          # to the .iss path (i.e. installer\installer-output\).
          $env:SHACKBOOK_VERSION = $version.TrimStart("v")
          $env:SHACKBOOK_STAGING = (Resolve-Path $stage).Path
          & $iscc /O. installer\shackbook.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }

          Get-ChildItem ShackBook-Setup-*.exe

      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: ShackBook-Setup-*-windows-x64.exe
          if-no-files-found: error

  # ── Linux (AppImage) ────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              ninja-build \
              build-essential \
              libgl1-mesa-dev \
              libxkbcommon-dev \
              libxcb-cursor0 \
              libxcb-xinerama0 \
              libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtwebsockets qtserialport'
          cache: true

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHACKBOOK_RELEASE=ON

      - name: Build
        run: cmake --build build

      - name: Trim unused Qt SQL drivers (post-build, pre-AppImage)
        # linuxdeploy-plugin-qt scans $QT_ROOT_DIR/plugins/sqldrivers and
        # tries to bundle every file there as an ELF binary — including
        # drivers like Mimer that need libraries the runner doesn't have,
        # AND any non-.so files that happen to be present (it doesn't
        # filter by extension).  We only use SQLite.  Delete every other
        # driver, and DO NOT leave any stray files behind.
        #
        # This must run after Build because Qt6Sql's CMake config
        # references the driver filenames directly during configure —
        # deleting them earlier breaks Qt6QMYSQLDriverPlugin's imported
        # target.
        run: |
          cd "$QT_ROOT_DIR/plugins/sqldrivers"
          echo "Before:"; ls -1
          find . -maxdepth 1 -type f -name '*.so' \
                 ! -name 'libqsqlite.so' -delete
          echo "After:"; ls -1

      - name: Stage AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/ShackBook AppDir/usr/bin/

          cat > AppDir/usr/share/applications/shackbook.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ShackBook
          GenericName=Ham Radio Logbook
          Exec=ShackBook
          Icon=shackbook
          Comment=Standalone ham radio logbook with TCI integration
          Categories=HamRadio;Network;
          Terminal=false
          EOF

          # Placeholder 256×256 solid-fill icon — replace with real artwork
          # later.  We use ImageMagick (preinstalled on ubuntu-22.04
          # runners) so the PNG is unambiguously valid; embedding base64
          # of a 1×1 PNG turns out to upset linuxdeploy's CImg validator.
          convert -size 256x256 xc:'#0a1320' \
              AppDir/usr/share/icons/hicolor/256x256/apps/shackbook.png

      - name: Build AppImage
        run: |
          # linuxdeploy + qt plugin from upstream continuous releases
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          # Tell linuxdeploy-plugin-qt where Qt's qmake lives.
          export QMAKE="$QT_ROOT_DIR/bin/qmake"

          ./linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              --plugin qt \
              --output appimage \
              --desktop-file AppDir/usr/share/applications/shackbook.desktop \
              --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/shackbook.png

          # Same rule as the Windows job: a release tag (v*) names the file;
          # anything else, e.g. a manual run from feat/foo, gets dev-<sha>, because
          # a branch name with a slash would turn the file name into a path.
          version="${GITHUB_REF_NAME}"
          case "$version" in v*) ;; *) version="dev-${GITHUB_SHA:0:7}" ;; esac
          mv ShackBook*.AppImage "ShackBook-${version}-linux-x86_64.AppImage"
          ls -lh ShackBook-*.AppImage

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: ShackBook-*-linux-x86_64.AppImage
          if-no-files-found: error

  # ── macOS (Apple Silicon + Intel) ───────────────────────────────────────
  build-macos:
    # Pinned, not -latest: the newer runner image's SDK dropped the legacy
    # AGL framework that Qt 6.8's link interface still references, killing
    # the link with "ld: framework 'AGL' not found" (first hit: v0.4.0).
    # Revisit when QT_VERSION moves to a release that no longer wants AGL.
    #
    # Both architectures build on this Apple Silicon runner. aqt's macOS Qt
    # (clang_64) is a universal x86_64+arm64 build, and ShackBook links
    # nothing but Qt (Hamlib's rigctld is found at runtime), so the Intel
    # build is a plain cross-compile. That keeps the AGL pin above in force
    # for both, and avoids GitHub's Intel runner images, which are being
    # retired.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            # Unchanged from before this job built Intel: no explicit
            # deployment target, so the SDK's default applies.
            deployment_target: ''
          - arch: x86_64
            # Many Intel Macs stop at macOS 12 or 13, so target the oldest
            # macOS that Qt 6.8 itself supports rather than the SDK default.
            deployment_target: '12.0'
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtwebsockets qtserialport'
          cache: true

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHACKBOOK_RELEASE=ON               -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}               ${{ matrix.deployment_target && format('-DCMAKE_OSX_DEPLOYMENT_TARGET={0}', matrix.deployment_target) || '' }}

      - name: Build
        run: cmake --build build

      - name: Check the binary's architecture
        # A cross-compile that silently fell back to the host architecture
        # would still produce a DMG; refuse to ship one with the wrong code.
        run: |
          bin=build/ShackBook.app/Contents/MacOS/ShackBook
          archs="$(lipo -archs "$bin")"
          echo "ShackBook binary architectures: $archs"
          if [ "$archs" != "${{ matrix.arch }}" ]; then
            echo "::error::expected ${{ matrix.arch }}, got $archs"
            exit 1
          fi
          otool -l "$bin" | grep -A4 LC_BUILD_VERSION | grep -E 'minos|sdk' || true

      - name: Launch check under Rosetta (Intel only)
        # Catches a build that links but cannot start on Intel (a missing
        # framework slice, a bad rpath). Rosetta is not guaranteed on hosted
        # runners, so skip with a warning rather than fail when it's absent.
        if: matrix.arch == 'x86_64'
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta 2 not available on this runner; skipping the Intel launch check"
            exit 0
          fi
          QT_QPA_PLATFORM=offscreen arch -x86_64 build/ShackBook.app/Contents/MacOS/ShackBook &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            echo "ShackBook (x86_64) still running after 10 s under Rosetta: launch OK"
            kill "$pid"
          else
            wait "$pid"; rc=$?
            echo "::error::ShackBook (x86_64) exited within 10 s under Rosetta (exit $rc)"
            exit 1
          fi

      - name: macdeployqt + DMG
        run: |
          # Bundle Qt frameworks into the .app
          "$QT_ROOT_DIR/bin/macdeployqt" build/ShackBook.app

          # Same rule as the Windows job: a release tag (v*) names the file;
          # anything else, e.g. a manual run from feat/foo, gets dev-<sha>, because
          # a branch name with a slash would turn the file name into a path.
          version="${GITHUB_REF_NAME}"
          case "$version" in v*) ;; *) version="dev-${GITHUB_SHA:0:7}" ;; esac
          dmg_name="ShackBook-${version}-macos-${{ matrix.arch }}.dmg"

          # Stage with README/LICENSE alongside the .app
          mkdir -p dmg-stage
          cp -R build/ShackBook.app dmg-stage/
          cp README.md LICENSE dmg-stage/

          hdiutil create -volname "ShackBook"               -srcfolder dmg-stage               -ov -format UDZO               "$dmg_name"
          ls -lh "$dmg_name"

      - uses: actions/upload-artifact@v5
        with:
          name: macos-${{ matrix.arch }}
          path: ShackBook-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # ── Publish GitHub Release ──────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f \
              \( -name '*.zip' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \) \
              -exec cp -v {} out/ \;
          ls -lh out/

      - uses: softprops/action-gh-release@v2
        with:
          name: ShackBook ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            out/*.zip
            out/*.AppImage
            out/*.dmg
            out/*.exe
